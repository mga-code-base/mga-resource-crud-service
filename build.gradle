plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5' // Synced with your standard
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.graalvm.buildtools.native' version '0.10.4' 
}

group = 'com.mygym.app'
version = '0.0.1-SNAPSHOT'
description = 'CRUD Service for Mongo DB'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' } // Required for JitPack model resolutions
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.2"
    }
}

dependencies {
    // Core Service Dependencies
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    // Automatic Native Isolation Condition 
    if (!project.gradle.startParameter.taskNames.any { it.contains("native") || it.contains("bootBuildImage") }) {
        implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    }
    
    // Core Shared Model Library (Updated to develop-SNAPSHOT)
    implementation 'com.github.my-gym-app:mga-all-models:develop-SNAPSHOT'
    
    // Developer Tooling Support (Lombok Managed by Gradle Plugins)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // Test Scaffolding
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

bootBuildImage {
    builder = 'paketobuildpacks/builder-jammy-java-tiny'
    environment = [
        'BP_NATIVE_IMAGE': 'true',
        'BP_JVM_VERSION': '25',
        'BPE_APPEND_SPRING_PROFILES_ACTIVE': 'native',
        'BPE_APPEND_ACTIVATEDENV': 'PRD',
        'BP_NATIVE_IMAGE_BUILD_ARGUMENTS': '--initialize-at-run-time=sun.security.util.Password$ConsoleHolder'
    ]
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Aspring.profiles.active=native"
    options.compilerArgs << "-AactivatedEnv=PRD"
}

tasks.named('processAot') {
    args '--spring.profiles.active=native', '--activatedEnv=PRD'
}