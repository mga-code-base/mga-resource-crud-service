# =======================================================
# SERVICE CONFIGURATION
# =======================================================
spring.application.name=mga-resource-crud-service
logging.structured.format.console=${LOG_FORMAT:ecs}
server.port=8081

# =======================================================
# MONGO CONFIGURATION
# =======================================================
spring.mongodb.uri=${MONGODB_URI:}

# =======================================================
# EUREKA / DISCOVERY CONFIGURATION
# =======================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# =======================================================
# ACTUATORS CONFIGURATION
# =======================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.health.mongo.additional-commands={ "ping": 1 }

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.mvc.problemdetails.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.tracing.export.enabled=${TRACING_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector.observability:4318/v1/traces}
management.otlp.metrics.export.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.data.mongodb.auto-index-creation=true

mga.outbox.broadcast-topic=broadcast-messages
mga.outbox.poll-interval=2s
mga.outbox.batch-size=100
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:}
spring.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:SSL}
spring.kafka.ssl.trust-store-type=JKS
spring.kafka.ssl.trust-store-location=${KAFKA_TRUSTSTORE_LOCATION:}
spring.kafka.ssl.trust-store-password=${KAFKA_TRUSTSTORE_PASSWORD:}
spring.kafka.ssl.key-store-type=PKCS12
spring.kafka.ssl.key-store-location=${KAFKA_KEYSTORE_LOCATION:}
spring.kafka.ssl.key-store-password=${KAFKA_KEYSTORE_PASSWORD:}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.template.observation-enabled=true
spring.kafka.producer.properties.max.block.ms=5000
